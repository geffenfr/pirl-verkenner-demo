name: PIRL Work97 exact v2.8 publication checks
on:
  push:
    branches: [work97-v280-publication]
permissions:
  contents: write
concurrency:
  group: pirl-work97-v280-publication
  cancel-in-progress: false
jobs:
  verify-exact-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
      options: --memory=3671m --memory-swap=3671m --shm-size=256m
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 playwright==1.63.0
      - run: python publication/work97/run.py
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PRO004_WORK97_${{ github.run_id }}_${{ github.run_attempt }}
          path: work97-evidence/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
