name: Verify public PIRL v2.6.0 date and exact bytes
on:
  push:
    paths:
      - .github/workflows/pirl-v260-verify-live-date-20261025.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify unchanged root URL and exact published HTML
        shell: bash
        run: |
          set -euo pipefail
          expected="bc76b69223d840e1d8c1ebbe86c850accc285af65be655956c0b001c5b7c49cc"
          url="https://geffenfr.github.io/pirl-verkenner-demo/"
          success=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --max-time 40 -H "Cache-Control: no-cache" "$url" --output /tmp/pirl-v260-live.html; then
              actual="$(sha256sum /tmp/pirl-v260-live.html | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then success=1; break; fi
              echo "Attempt $attempt: expected $expected; received $actual"
            else
              echo "Attempt $attempt: HTTP retrieval failed"
            fi
            sleep 8
          done
          if [ "$success" -ne 1 ]; then echo "LIVE_ROOT_EXACT_BYTES_UNVERIFIED"; exit 1; fi
          if ! grep -Fq 'v2.6.0 · 25-10-2026' /tmp/pirl-v260-live.html; then echo "RELEASE_DATE_MISSING"; exit 1; fi
          if ! grep -Fq "version:'2.5.0',date:'2026-10-23'" /tmp/pirl-v260-live.html; then echo "HISTORIC_DATE_MISSING"; exit 1; fi
          bytes="$(wc -c </tmp/pirl-v260-live.html | tr -d ' ')"
          test "$bytes" = "11708733"
          printf '{"schema":"pirl.live-root.v1","status":"PASS","url":"%s","sha256":"%s","bytes":%s,"date":"2026-10-25","v25HistoryRetained":true}\n' "$url" "$expected" "$bytes" > /tmp/pirl-v260-live-proof.json
          cat /tmp/pirl-v260-live-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: pirl-v260-live-root-proof-20261025
          path: /tmp/pirl-v260-live-proof.json
          retention-days: 30
